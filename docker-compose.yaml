name: adonis-boilerplate

services:
    postgres:
        image: postgres
        restart: always
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 30s
            timeout: 30s
            retries: 3

    backend:
      image: the-alien-club/adonis-boilerplate:latest
      build:
        context: ./
        dockerfile: ./Dockerfile
      restart: always
      command: ["node", "./bin/server.js"]
